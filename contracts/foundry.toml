[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
bytecode_hash = "none"
via_ir = true
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64
show_metrics = true
fail_on_revert = true # a reverting handler call fails the run (handler withdraw must never revert)

[lint]
lint_on_build = false
