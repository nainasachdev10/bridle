[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
bytecode_hash = "none"
via_ir = false
optimizer = true
optimizer_runs = 200
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 64

[lint]
lint_on_build = false
